name: Build installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version'
        required: true
        default: '1.1.0'
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  TINYPNG_RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt SDK
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: clang_64
          modules: qtsvg
          cache: true
      - name: Build and verify universal DMG
        shell: bash
        env:
          TINYPNG_MAC_ARCHS: 'x86_64 arm64'
        run: |
          export TINYPNG_VERSION="${TINYPNG_RELEASE_VERSION#v}"
          bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TinyPNG-macOS-universal
          path: Installer/TinyPNG-macOS-universal-*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Qt SDK
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: qtsvg
          cache: true
      - name: Build EXE installer and portable ZIP
        shell: pwsh
        run: |
          $version = $env:TINYPNG_RELEASE_VERSION.TrimStart('v')
          ./scripts/build-windows.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: TinyPNG-Windows-x64
          path: |
            Installer/TinyPNG-Windows-x64-*.exe
            Installer/TinyPNG-Windows-x64-*.zip
          if-no-files-found: error
